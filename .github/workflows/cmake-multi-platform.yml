# based on https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake build and test

on:
  workflow_dispatch:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest]
        build_type: [Debug, Release]
        c_compiler: [gcc, clang]
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cxx_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cxx_compiler: clang++

    steps:
    - uses: actions/checkout@v3

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
        echo "gcc-ver=15" >> "$GITHUB_OUTPUT"
        echo "clang-ver=20" >> "$GITHUB_OUTPUT"

    # https://stackoverflow.com/a/67791068
    - name: switch to gcc-${{ steps.strings.outputs.gcc-ver }}
      if: matrix.os == 'ubuntu-latest' && matrix.c_compiler == 'gcc'
      run: |
        sudo apt install gcc-${{ steps.strings.outputs.gcc-ver }} g++-${{ steps.strings.outputs.gcc-ver }}
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ steps.strings.outputs.gcc-ver }} ${{ steps.strings.outputs.gcc-ver }}0
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{ steps.strings.outputs.gcc-ver }} ${{ steps.strings.outputs.gcc-ver }}0
        sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-${{ steps.strings.outputs.gcc-ver }} ${{ steps.strings.outputs.gcc-ver }}0
        sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-${{ steps.strings.outputs.gcc-ver }} ${{ steps.strings.outputs.gcc-ver }}0

    - name: switch to clang-${{ steps.strings.outputs.clang-ver }}
      if: matrix.os == 'ubuntu-latest' && matrix.c_compiler == 'clang'
      run: |
        sudo apt install clang-${{ steps.strings.outputs.clang-ver }}
        sudo update-alternatives --install /usr/bin/clang  clang  /usr/bin/clang-${{ steps.strings.outputs.clang-ver }} ${{ steps.strings.outputs.clang-ver }}0
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-${{ steps.strings.outputs.clang-ver }} ${{ steps.strings.outputs.clang-ver }}0
        sudo update-alternatives --install /usr/bin/cc  cc  /usr/bin/clang-${{ steps.strings.outputs.clang-ver }}   ${{ steps.strings.outputs.clang-ver }}0
        sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/clang++-${{ steps.strings.outputs.clang-ver }} ${{ steps.strings.outputs.clang-ver }}0

    - name: Configure CMake
      run: >
        cmake --preset ci
        -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} -j

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}/tests
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure

    - name: Install
      run: |
        cmake --install ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --prefix ${{ github.workspace }}/out
        ls -R ${{ github.workspace }}/out
